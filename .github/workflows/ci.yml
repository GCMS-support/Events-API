name: Events API CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: events-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit and integration tests
        run: python -m pytest --cov=app --cov=models --cov=routes --cov-fail-under=95 --cov-report=term-missing --junitxml=test-results.xml
      - name: Test inside Docker
        run: |
          docker build --target test -t events-api-tests .
          docker run --rm events-api-tests
      - name: Build production image
        run: docker build --build-arg APP_REVISION="$GITHUB_SHA" -t events-api:ci .
      - name: Smoke test production container over HTTP
        run: |
          docker run -d --name events-api -p 127.0.0.1:5000:5000 -e SECRET_KEY="$(openssl rand -hex 32)" -e JWT_SECRET_KEY="$(openssl rand -hex 32)" events-api:ci
          python smoke_test.py http://127.0.0.1:5000 --exercise --revision "$GITHUB_SHA"
      - name: Container logs
        if: always()
        run: docker logs events-api 2>/dev/null || true
      - name: Stop temporary container
        if: always()
        run: docker rm -f events-api 2>/dev/null || true
      - name: Publish tested image to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker tag events-api:ci "$DOCKERHUB_USERNAME/events-api:$GITHUB_SHA"
          docker tag events-api:ci "$DOCKERHUB_USERNAME/events-api:latest"
          docker push "$DOCKERHUB_USERNAME/events-api:$GITHUB_SHA"
          docker push "$DOCKERHUB_USERNAME/events-api:latest"
          docker logout
      - name: Deploy to Render and verify the new revision
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RENDER_URL != '' && vars.DOCKERHUB_USERNAME != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          python -c "import os,requests; r=requests.post(os.environ['RENDER_DEPLOY_HOOK'], timeout=30); r.raise_for_status()"
          python smoke_test.py "$RENDER_URL" --revision "$GITHUB_SHA" --wait 600
